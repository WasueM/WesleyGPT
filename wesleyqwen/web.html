<!doctype html>
<!-- Wesley wrote this -->
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>WesleyQwen Chat</title>
<style>
  :root {
    --bg: #f6f5f2; --panel: #ffffff; --ink: #1d1d1f; --muted: #6b6b70; --line: #e3e1dc;
    --you: #2f5bea; --you-ink: #ffffff; --bot: #ffffff; --accent: #2f5bea; --warn: #b3261e;
    --think: #f0eee9;
  }
  @media (prefers-color-scheme: dark) {
    :root { --bg: #141416; --panel: #1d1d20; --ink: #ececef; --muted: #9a9aa2; --line: #2e2e33;
            --you: #4a72ff; --you-ink: #ffffff; --bot: #232327; --accent: #6d8cff; --warn: #ff8a80;
            --think: #29292e; }
  }
  * { box-sizing: border-box; }
  body { margin: 0; height: 100vh; display: flex; flex-direction: column; background: var(--bg);
         color: var(--ink); font: 15px/1.5 -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
  header { display: flex; gap: 12px; align-items: center; padding: 12px 16px; border-bottom: 1px solid var(--line);
           background: var(--panel); flex-wrap: wrap; }
  header h1 { font-size: 16px; margin: 0 auto 0 0; font-weight: 600; }
  header label { color: var(--muted); font-size: 13px; display: flex; gap: 6px; align-items: center; }
  select, button { font: inherit; color: var(--ink); background: var(--panel); border: 1px solid var(--line);
                   border-radius: 8px; padding: 6px 10px; cursor: pointer; }
  button:disabled, select:disabled { opacity: .5; cursor: default; }
  #log { flex: 1; overflow-y: auto; padding: 20px 16px; display: flex; flex-direction: column; gap: 12px; }
  .msg { max-width: min(720px, 92%); padding: 10px 14px; border-radius: 14px; white-space: pre-wrap;
         word-wrap: break-word; }
  .you { align-self: flex-end; background: var(--you); color: var(--you-ink); border-bottom-right-radius: 4px; }
  .bot { align-self: flex-start; background: var(--bot); border: 1px solid var(--line); border-bottom-left-radius: 4px; }
  .note { align-self: center; color: var(--muted); font-size: 13px; }
  .err { color: var(--warn); }
  .msg video { display: block; max-width: 320px; width: 100%; border-radius: 8px; margin-bottom: 6px; }
  details { background: var(--think); border-radius: 8px; padding: 6px 10px; margin-bottom: 8px;
            color: var(--muted); font-size: 13px; }
  details summary { cursor: pointer; }
  .cursor::after { content: "▍"; animation: blink 1s steps(1) infinite; color: var(--muted); }
  @keyframes blink { 50% { opacity: 0; } }
  footer { border-top: 1px solid var(--line); background: var(--panel); padding: 12px 16px; }
  #attached { display: none; align-items: center; gap: 10px; margin-bottom: 10px; font-size: 13px; color: var(--muted); }
  #attached video { height: 54px; border-radius: 6px; }
  #attached progress { width: 120px; }
  form { display: flex; gap: 8px; align-items: flex-end; }
  textarea { flex: 1; resize: none; font: inherit; color: var(--ink); background: var(--bg);
             border: 1px solid var(--line); border-radius: 10px; padding: 9px 12px; min-height: 42px; max-height: 180px; }
  #send { background: var(--accent); color: #fff; border-color: var(--accent); padding: 9px 16px; }
</style>
</head>
<body>
<header>
  <h1>WesleyQwen</h1>
  <label>Model <select id="model"></select></label>
  <label><input type="checkbox" id="think"> Thinking</label>
  <button id="clear" type="button">New chat</button>
</header>
<main id="log"><div class="note">Ask anything, or attach a video with 🎞️. Videos are uploaded to the PC, then read at 2 frames per second.</div></main>
<footer>
  <div id="attached">
    <video id="preview" muted></video>
    <span id="fileName"></span>
    <progress id="progress" max="1" value="0"></progress>
    <button id="unattach" type="button">Remove</button>
  </div>
  <form id="form">
    <input type="file" id="file" accept="video/*" hidden>
    <button id="pick" type="button" title="Attach a video">🎞️</button>
    <textarea id="text" rows="1" placeholder="Message (Enter to send, Shift+Enter for a new line)"></textarea>
    <button id="send" type="submit">Send</button>
  </form>
</footer>
<script>
const $ = (id) => document.getElementById(id);
const log = $("log");
let video = null;      // {id, url, name} once uploaded
let uploading = null;  // the XHR while a file is going up
let busy = false;

function bubble(cls, text) {
  const div = document.createElement("div");
  div.className = "msg " + cls;
  if (text !== undefined) div.textContent = text;
  log.appendChild(div);
  log.scrollTop = log.scrollHeight;
  return div;
}

function setBusy(on) {
  busy = on;
  for (const id of ["send", "pick", "model", "think", "clear"]) $(id).disabled = on;
}

async function post(path, body) {
  const res = await fetch(path, {method: "POST", headers: {"Content-Type": "application/json"}, body: JSON.stringify(body || {})});
  const data = await res.json();
  if (!res.ok) throw new Error(data.error || res.statusText);
  return data;
}

function showState(s) {
  $("model").innerHTML = s.models.map((m) => `<option ${m === s.model ? "selected" : ""}>${m}</option>`).join("");
  $("think").checked = s.thinking;
}

// The stream carries thinking then "</think>" then the answer; show thinking folded away.
function renderReply(div, text, thinking, done) {
  div.textContent = "";
  let answer = text;
  if (thinking) {
    const cut = text.indexOf("</think>");
    const thought = (cut < 0 ? text : text.slice(0, cut)).replace("<think>", "").trim();
    answer = cut < 0 ? "" : text.slice(cut + 8).trim();
    if (thought) {
      const d = document.createElement("details");
      d.open = cut < 0;
      d.innerHTML = "<summary>Thinking</summary>";
      d.appendChild(document.createTextNode(thought));
      div.appendChild(d);
    }
  }
  div.appendChild(document.createTextNode(answer));
  div.classList.toggle("cursor", !done);
  log.scrollTop = log.scrollHeight;
}

function clearAttachment() {
  if (uploading) uploading.abort();
  uploading = null;
  if (video) URL.revokeObjectURL(video.url);
  video = null;
  $("file").value = "";
  $("attached").style.display = "none";
}

$("pick").onclick = () => $("file").click();
$("unattach").onclick = clearAttachment;

$("file").onchange = () => {
  const file = $("file").files[0];
  if (!file) return;
  clearAttachment();
  const url = URL.createObjectURL(file);
  $("preview").src = url;
  $("fileName").textContent = file.name;
  $("progress").value = 0;
  $("progress").style.display = "";
  $("attached").style.display = "flex";
  const xhr = new XMLHttpRequest();
  uploading = xhr;
  xhr.open("POST", "/upload?name=" + encodeURIComponent(file.name));
  xhr.upload.onprogress = (e) => { if (e.lengthComputable) $("progress").value = e.loaded / e.total; };
  xhr.onload = () => {
    uploading = null;
    if (xhr.status !== 200) { bubble("note err", "Upload failed: " + xhr.responseText); return clearAttachment(); }
    video = {id: JSON.parse(xhr.responseText).video, url, name: file.name};
    $("progress").style.display = "none";
    $("fileName").textContent = file.name + " — ready";
  };
  xhr.onerror = () => { uploading = null; bubble("note err", "Upload failed: connection lost"); clearAttachment(); };
  xhr.send(file);
};

$("form").onsubmit = async (e) => {
  e.preventDefault();
  if (busy) return;
  if (uploading) return bubble("note", "Still uploading the video — one moment.");
  const text = $("text").value.trim();
  if (!text && !video) return;
  const you = bubble("you");
  if (video) {
    const v = document.createElement("video");
    v.src = video.url; v.controls = true; v.muted = true;
    you.appendChild(v);
  }
  you.appendChild(document.createTextNode(text || (video ? "Describe what happens in this video." : "")));
  const body = {text, video: video && video.id};
  const thinking = $("think").checked;
  $("text").value = "";
  video = null;
  $("attached").style.display = "none";
  $("file").value = "";
  setBusy(true);
  const bot = bubble("bot cursor");
  const started = performance.now();
  try {
    const res = await fetch("/chat", {method: "POST", headers: {"Content-Type": "application/json"}, body: JSON.stringify(body)});
    if (!res.ok) throw new Error((await res.json()).error || res.statusText);
    const reader = res.body.getReader();
    const decoder = new TextDecoder();
    let text = "";
    for (;;) {
      const {value, done} = await reader.read();
      if (done) break;
      text += decoder.decode(value, {stream: true});
      renderReply(bot, text, thinking, false);
    }
    renderReply(bot, text, thinking, true);
    bubble("note", `${$("model").value} · ${((performance.now() - started) / 1000).toFixed(1)} s`);
  } catch (err) {
    bot.classList.remove("cursor");
    bot.classList.add("err");
    bot.textContent = "Error: " + err.message;
  } finally {
    setBusy(false);
    $("text").focus();
  }
};

$("text").addEventListener("keydown", (e) => {
  if (e.key === "Enter" && !e.shiftKey) { e.preventDefault(); $("form").requestSubmit(); }
});
$("text").addEventListener("input", () => {
  $("text").style.height = "auto";
  $("text").style.height = $("text").scrollHeight + "px";
});

$("model").onchange = async () => {
  const name = $("model").value;
  setBusy(true);
  const note = bubble("note", `Loading ${name}…`);
  try { showState(await post("/model", {name})); note.textContent = `Switched to ${name}. The conversation carries over.`; }
  catch (err) { note.textContent = "Model switch failed: " + err.message; note.classList.add("err"); }
  finally { setBusy(false); }
};
$("think").onchange = async () => {
  try { showState(await post("/think", {on: $("think").checked})); }
  catch (err) { bubble("note err", err.message); }
};
$("clear").onclick = async () => {
  try { await post("/clear"); log.innerHTML = ""; bubble("note", "New chat."); }
  catch (err) { bubble("note err", err.message); }
};

// The server keeps the conversation across page reloads, but this page cannot redraw it.
fetch("/state").then((r) => r.json()).then((s) => {
  showState(s);
  if (s.turns) bubble("note", `The model still remembers ${s.turns / 2} earlier exchange(s) not shown here. Press New chat to start fresh.`);
});
</script>
</body>
</html>
